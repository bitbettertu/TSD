function nav(id,label){return `<button class="nav ${state.screen===id?'active':''}" data-action="nav" data-screen="${id}"><i>${icon(id)}</i><span>${label}</span></button>`}
function shell(content){return `<section class="app"><header class="topbar"><div class="logo">U</div><div class="topmeta"><strong>Смарт ТСД</strong><span>UMAI · Глобус 1 · Операционист</span></div><button class="net ${state.online?'':'offline'}" data-action="toggle-online"><i class="dot"></i><span>${state.online?'Онлайн':'Офлайн'}</span>${state.queue?`<em class="badge">${state.queue}</em>`:''}</button></header><div class="scroll" id="scroll">${content}</div><nav class="bottom">${nav('home','Операции')}${nav('catalog','Справочник')}${nav('sync','Обмен')}${nav('profile','Профиль')}</nav>${modalView()}${state.toast?`<div class="toast">${state.toast}</div>`:''}</section>`}
function back(title,sub,to='home'){return `<div class="back"><button data-action="nav" data-screen="${to}">${icon('back')}</button><div><b>${title}</b><span>${sub||''}</span></div></div>`}
function section(title,sub,action=''){return `<div class="section-title"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}

function loginView(){return `<section class="login"><div class="login-logo">U</div><h1>Смарт ТСД</h1><p>Приёмка и учёт на промышленном терминале UMAI GROUP.</p><div class="login-card"><div class="point"><div class="point-icon">⌖</div><div><b>Маркет «Глобус 1»</b><span>Устройство TSD-014-03 привязано к складу</span></div></div><div class="field"><label>Код сотрудника из 1С</label><input id="loginCode" value="OP-014"></div><div class="field"><label>Пароль</label><input id="loginPass" type="password" value="1234"></div><button class="btn red wide" data-action="login">Войти</button></div></section>`}

function homeView(){return `<div class="welcome"><small>Смена открыта · 11:30</small><h1>Доброе утро, Нурбек</h1><p>Все операции сохраняются на устройстве и передаются в 1С автоматически.</p></div><div class="stats"><div class="card stat"><b>7</b><span>приёмок сегодня</span></div><div class="card stat"><b>2</b><span>активные задачи</span></div><div class="card stat"><b>${state.queue}</b><span>операции в очереди 1С</span></div></div>${section('Мои операции','Только процессы MVP1')}<div class="ops"><button class="op" data-action="nav" data-screen="supplier-orders"><span class="op-icon">${icon('supplier')}</span><span><b>Приёмка от поставщика</b><span>По открытому заказу с прямым созданием поступления</span></span><span class="chev">›</span></button><button class="op" data-action="nav" data-screen="rc-docs"><span class="op-icon">${icon('rc')}</span><span><b>Приёмка из РЦ</b><span>План, факт и автоматическая недопоставка</span></span><span class="chev">›</span></button><button class="op" data-action="nav" data-screen="assets"><span class="op-icon">${icon('asset')}</span><span><b>ТМЗ и МБП</b><span>Отдельные списки, приём и перемещение</span></span><span class="chev">›</span></button></div>${section('Активные задачи','На сегодня','')}<div class="card task"><i class="task-line"></i><div class="task-main"><b>Приёмка РЦ · Г010003188</b><span>РЦ Жашылча СОФ · до 12:30</span><div class="pill-row"><span class="pill red">Высокий приоритет</span></div></div><span class="chev">›</span></div><div class="card task"><i class="task-line" style="background:#235fa7"></i><div class="task-main"><b>Инвентаризация МБП</b><span>Бэк-офис · до 17:00</span><div class="pill-row"><span class="pill blue">По графику</span></div></div><span class="chev">›</span></div>`}

function supplierOrdersView(){const q=state.supplierSearch.toLowerCase();const list=orders.filter(o=>(o.number+' '+o.supplier).toLowerCase().includes(q));return `${back('Приёмка от поставщика','Выберите открытый заказ')}<div class="notice"><b>Данные приходят из 1С</b>Поставщик, договор, склад, строки, цены и налоги доступны только для просмотра.</div><div class="search"><input id="supplierSearch" placeholder="Номер заказа или поставщик" value="${state.supplierSearch}"><button class="scan-btn" data-action="fake-scan-order">▣</button></div><div class="filters"><button class="filter active">К приёмке</button><button class="filter">Сегодня</button><button class="filter">Все поставщики</button></div>${list.map(orderCard).join('')||empty('Заказы не найдены','Измените поисковый запрос.')}`}
function orderCard(o){return `<article class="card doc"><div class="doc-head"><h3>${o.supplier}</h3><span class="doc-code">${o.number}</span></div><p>Заказ поставщику от ${o.date}</p><div class="doc-meta"><div><span>Склад</span><b>${o.warehouse}</b></div><div><span>Сумма</span><b>${money(o.sum)}</b></div><div><span>Строк</span><b>${o.lines.length}</b></div><div><span>Статус</span><b>${o.status}</b></div></div><div class="doc-foot"><span class="pill green">Открыт</span><button class="btn black small" data-action="open-order" data-id="${o.id}">Открыть</button></div></article>`}

function supplierReceiptView(){const o=orders.find(x=>x.id===state.activeOrder);if(!o)return supplierOrdersView();return `${back('Приёмка по заказу',`${o.number} · ${o.supplier}`,'supplier-orders')}<div class="card order-head"><h3>Заказ ${o.number}</h3><div class="kv"><span>Поставщик</span><b>${o.supplier}</b></div><div class="kv"><span>Договор</span><b>${o.contract}</b></div><div class="kv"><span>Склад</span><b>${o.warehouse}</b></div><div class="kv"><span>Сумма заказа</span><b>${money(o.sum)}</b></div></div><div class="field"><label>№ входящей накладной</label><input id="invoiceNo" value="${state.orderReceipt.invoiceNo}" placeholder="Введите номер"></div><div class="field"><label>Дата входящей накладной</label><input id="invoiceDate" type="date" value="${state.orderReceipt.invoiceDate}"></div><div class="scan-panel"><div class="scan-modes"><button class="mode ${state.scanMode==='flow'?'active':''}" data-action="scan-mode" data-mode="flow">Поток</button><button class="mode ${state.scanMode==='single'?'active':''}" data-action="scan-mode" data-mode="single">Штучный</button></div><div class="scan-zone"><i>▣</i><b>Сканируйте товар из заказа</b><span>ШК сопоставляется со строкой выбранного заказа</span><button data-action="simulate-order-scan">Имитировать скан</button></div></div>${section('Строки заказа','Нажмите на наименование или количество для ввода факта')} ${o.lines.map((l,i)=>supplierLine(o,l,i)).join('')}<div class="sticky"><button class="btn red wide" data-action="supplier-review">Проверить и создать поступление</button></div>`}
function supplierLine(o,l,i){const p=product(l.product);const rec=state.orderReceipt.lines[p.id]||{};const remaining=Math.max(0,l.ordered-l.accepted);const fact=Number(rec.qty||0);return `<article class="card item"><div class="item-top"><button class="item-name" data-action="edit-order-line" data-product="${p.id}">${p.name}</button><button class="qty" data-action="edit-order-line" data-product="${p.id}">${fact} ${p.unit}</button></div><div class="item-sub">${p.code} · ${p.brand} · Цена: ${money(p.price)}</div><div class="metrics"><div class="metric"><span>Заказано</span><b>${l.ordered}</b></div><div class="metric"><span>Принято</span><b>${l.accepted}</b></div><div class="metric"><span>Остаток</span><b>${remaining}</b></div><div class="metric"><span>Факт</span><b>${fact}</b></div></div><div class="line-tags">${rec.expiry?`<span class="pill green">Годен до ${rec.expiry}</span>`:'<span class="pill amber">Срок не указан</span>'}${rec.tnved?`<span class="pill blue">ТН ВЭД заполнен</span>`:''}${rec.gtd?`<span class="pill">ГТД заполнен</span>`:''}</div></article>`}

function supplierReviewView(){const o=orders.find(x=>x.id===state.activeOrder);const lines=o.lines.map(l=>{const p=product(l.product);const r=state.orderReceipt.lines[p.id]||{};return {p,qty:Number(r.qty||0),expiry:r.expiry||'',tnved:r.tnved||p.tnved||'',gtd:r.gtd||p.gtd||''}});const filled=lines.filter(x=>x.qty>0);const invalid=filled.filter(x=>x.p.expiry&&!x.expiry);return `${back('Проверка поступления',o.number,'supplier-receipt')}<div class="card order-head"><h3>Документ «Поступление товаров»</h3><div class="kv"><span>Заказ поставщику</span><b>${o.number}</b></div><div class="kv"><span>Поставщик</span><b>${o.supplier}</b></div><div class="kv"><span>Входящая накладная</span><b>${state.orderReceipt.invoiceNo||'Не указана'} от ${state.orderReceipt.invoiceDate}</b></div><div class="kv"><span>Строк к созданию</span><b>${filled.length}</b></div></div>${invalid.length?`<div class="notice red"><b>Нельзя провести документ</b>У ${invalid.length} строк не указан срок годности.</div>`:`<div class="notice"><b>Готово к отправке</b>1С заполнит шапку, цены, суммы и налоги из выбранного заказа.</div>`}${filled.map(x=>`<div class="card review-line"><div class="review-top"><b>${x.p.name}</b><span class="pill green">${x.qty} ${x.p.unit}</span></div><div class="item-sub">Годен до: ${x.expiry||'—'} · ТН ВЭД: ${x.tnved||'—'} · ГТД: ${x.gtd||'—'}</div></div>`).join('')||empty('Нет факта приёмки','Вернитесь и добавьте количество по строкам.')}<div class="sticky"><button class="btn red wide" data-action="create-receipt" ${(!filled.length||invalid.length)?'disabled':''}>Создать и провести в 1С</button></div>`}

function rcDocsView(){const q=state.rcSearch.toLowerCase();const list=transfers.filter(x=>(x.number+' '+x.sender).toLowerCase().includes(q));return `${back('Приёмка из РЦ','Выберите исходное перемещение')}<div class="notice"><b>Направление РЦ → маркет</b>Исходный документ создан на РЦ. На ТСД вводится только факт по строкам.</div><div class="search"><input id="rcSearch" placeholder="Номер или РЦ" value="${state.rcSearch}"><button class="scan-btn" data-action="fake-scan-rc">▣</button></div>${list.map(transferCard).join('')}`}
function transferCard(t){return `<article class="card doc"><div class="doc-head"><h3>${t.sender}</h3><span class="doc-code">${t.number}</span></div><p>Перемещение из филиала от ${t.date}</p><div class="doc-meta"><div><span>Получатель</span><b>${t.receiver}</b></div><div><span>Документ отгрузки</span><b>${t.shipment}</b></div><div><span>Строк</span><b>${t.lines.length}</b></div><div><span>Статус</span><b>${t.status}</b></div></div><div class="doc-foot"><span class="pill red">Требует приёмки</span><button class="btn black small" data-action="open-transfer" data-id="${t.id}">Открыть</button></div></article>`}

function rcReceiptView(){const t=transfers.find(x=>x.id===state.activeTransfer);if(!t)return rcDocsView();return `${back('Приёмка перемещения',`${t.number} · ${t.sender}`,'rc-docs')}<div class="card order-head"><h3>Перемещение ${t.number}</h3><div class="kv"><span>Отправитель</span><b>${t.sender}</b></div><div class="kv"><span>Получатель</span><b>${t.receiver}</b></div><div class="kv"><span>Документ отгрузки</span><b>${t.shipment}</b></div></div><div class="scan-panel"><div class="scan-modes"><button class="mode ${state.scanMode==='flow'?'active':''}" data-action="scan-mode" data-mode="flow">Поток</button><button class="mode ${state.scanMode==='single'?'active':''}" data-action="scan-mode" data-mode="single">Штучный</button></div><div class="scan-zone"><i>▣</i><b>Сканируйте позиции перемещения</b><span>Овощи и весовой товар всегда перевешиваются</span><button data-action="simulate-rc-scan">Имитировать скан</button></div></div>${t.lines.map(l=>rcLine(t,l)).join('')}<div class="sticky"><button class="btn red wide" data-action="rc-review">Проверить расхождения</button></div>`}
function rcLine(t,l){const p=product(l.product);const fact=state.rcFact[p.id]!==undefined?state.rcFact[p.id]:l.fact;const delta=fact-l.plan;return `<article class="card item"><div class="item-top"><button class="item-name" data-action="edit-rc-line" data-product="${p.id}">${p.name}</button><button class="qty" data-action="edit-rc-line" data-product="${p.id}">${fact} ${p.unit}</button></div><div class="item-sub">${p.code} · План из документа РЦ</div><div class="metrics"><div class="metric"><span>План</span><b>${l.plan}</b></div><div class="metric"><span>Факт</span><b>${fact}</b></div><div class="metric"><span>Дельта</span><b>${delta>0?'+':''}${round(delta)}</b></div><div class="metric"><span>Цена</span><b>${p.price}</b></div></div></article>`}
function round(v){return Math.round(v*1000)/1000}

function rcReviewView(){const t=transfers.find(x=>x.id===state.activeTransfer);const rows=t.lines.map(l=>{const p=product(l.product);const fact=state.rcFact[p.id]!==undefined?state.rcFact[p.id]:l.fact;return {p,plan:l.plan,fact,delta:round(fact-l.plan),short:round(Math.max(0,l.plan-fact))}});const shorts=rows.filter(x=>x.short>0);const over=rows.filter(x=>x.delta>0);return `${back('Расхождения',t.number,'rc-receipt')}<div class="summary-grid"><div class="card summary ok"><b>${rows.filter(x=>x.delta===0).length}</b><span>совпало</span></div><div class="card summary bad"><b>${shorts.length}</b><span>недопоставка</span></div><div class="card summary warn"><b>${over.length}</b><span>перевоз</span></div><div class="card summary"><b>${rows.length}</b><span>всего строк</span></div></div>${shorts.length?`<div class="notice amber"><b>Будет создан документ недопоставки</b>Направление: ${t.receiver} → ${t.sender}. Количество рассчитывается автоматически: план − факт.</div>`:`<div class="notice"><b>Недопоставки нет</b>Будет подтверждено исходное перемещение РЦ → маркет.</div>`}${rows.map(x=>`<div class="card review-line"><div class="review-top"><b>${x.p.name}</b><span class="delta ${x.delta===0?'ok':x.delta<0?'short':'over'}">${x.delta>0?'+':''}${x.delta}</span></div><div class="metrics"><div class="metric"><span>План</span><b>${x.plan}</b></div><div class="metric"><span>Факт</span><b>${x.fact}</b></div><div class="metric"><span>Недопоставка</span><b>${x.short}</b></div><div class="metric"><span>Ед.</span><b>${x.p.unit}</b></div></div></div>`).join('')}<div class="sticky"><button class="btn red wide" data-action="close-transfer">Закрыть приёмку</button></div>`}

function assetsView(){return `${back('ТМЗ и МБП','Отдельные списки, как в 1С')}<div class="tabs"><button class="tab ${state.assetTab==='tmz'?'active':''}" data-action="asset-tab" data-tab="tmz">ТМЗ</button><button class="tab ${state.assetTab==='mbp'?'active':''}" data-action="asset-tab" data-tab="mbp">МБП</button></div><div class="notice"><b>МОЛ определяется автоматически</b>Текущий пользователь: Нурбек Ибраимов. Склад, организация, цены и счета поступают из 1С.</div><div class="asset-ops"><button class="asset-op" data-action="asset-op" data-op="receipt"><i>＋</i><b>Приём</b><span>Скан позиции и ввод фактического количества</span></button><button class="asset-op" data-action="asset-op" data-op="transfer"><i>⇄</i><b>Перемещение</b><span>Получатель выбирается из справочника 1С</span></button></div>${section(`Справочник ${state.assetTab.toUpperCase()}`,'Данные синхронизированы из 1С')} ${assetCatalog().map(assetCard).join('')}`}
function assetCatalog(){return catalog.filter(x=>x.kind===state.assetTab)}
function assetCard(a){return `<article class="card asset-row"><h3>${a.name}</h3><p>${a.code} · ${a.barcode}</p><div class="asset-meta"><div><span>Остаток</span><b>${a.stock} ${a.unit}</b></div><div><span>Цена</span><b>${money(a.price)}</b></div></div></article>`}

function assetOperationView(){const isReceipt=state.assetOperation==='receipt';return `${back(`${isReceipt?'Приём':'Перемещение'} ${state.assetTab.toUpperCase()}`,isReceipt?'Создание готового черновика в 1С':'Документ «Перемещение ТМЗ и МБП»','assets')}<div class="card order-head"><h3>Реквизиты из 1С</h3><div class="kv"><span>Раздел</span><b>${state.assetTab.toUpperCase()}</b></div><div class="kv"><span>Склад-отправитель</span><b>Глобус 1</b></div><div class="kv"><span>МОЛ-отправитель</span><b>Нурбек Ибраимов</b></div><div class="kv"><span>Организация</span><b>Глобус</b></div></div>${!isReceipt?`<div class="field"><label>Склад-получатель</label><select id="assetWarehouse"><option>Глобус 2</option><option>Глобус 7</option><option>Бэк-офис</option></select></div><div class="field"><label>МОЛ-получатель</label><select id="assetMol"><option>Администрация Глобус 2</option><option>А. Токтосунов</option><option>Ж. Садыкова</option></select></div>`:''}<div class="scan-panel"><div class="scan-zone"><i>▣</i><b>Сканируйте ${state.assetTab.toUpperCase()}</b><span>На устройстве вводится только фактическое количество</span><button data-action="simulate-asset-scan">Имитировать скан</button></div></div>${state.assetLines.map((x,i)=>{const a=product(x.product);return `<div class="card item"><div class="item-top"><button class="item-name" data-action="edit-asset-line" data-index="${i}">${a.name}</button><button class="qty" data-action="edit-asset-line" data-index="${i}">${x.qty} ${a.unit}</button></div><div class="item-sub">${a.code} · Цена и сумма рассчитываются в 1С</div></div>`}).join('')||empty('Позиции не добавлены','Отсканируйте первую позицию.')}<div class="sticky"><button class="btn red wide" data-action="save-asset" ${state.assetLines.length?'':'disabled'}>${isReceipt?'Создать черновик поступления':'Создать перемещение'}</button></div>`}

function catalogView(){const q=state.catalogSearch.toLowerCase();const list=catalog.filter(x=>(x.name+' '+x.code+' '+x.barcode).toLowerCase().includes(q));return `${section('Справочник','Поиск по коду, ШК и наименованию')}<div class="search"><input id="catalogSearch" placeholder="Поиск товара, ТМЗ или МБП" value="${state.catalogSearch}"><button class="scan-btn" data-action="catalog-scan">▣</button></div><div class="filters"><button class="filter active">Все</button><button class="filter">Товары</button><button class="filter">ТМЗ</button><button class="filter">МБП</button></div>${list.map(x=>`<article class="card asset-row"><h3>${x.name}</h3><p>${x.code} · ${x.barcode}</p><div class="asset-meta"><div><span>Остаток</span><b>${x.stock} ${x.unit}</b></div><div><span>${x.kind==='product'?'Цена':'Категория'}</span><b>${x.kind==='product'?money(x.price):x.category}</b></div></div></article>`).join('')}`}

function syncView(){return `${section('Обмен с 1С','Прямая интеграция через API')}<div class="notice"><b>${state.online?'Соединение активно':'Работа в офлайн-режиме'}</b>${state.online?'Операции отправляются автоматически.':'Новые действия сохраняются локально и будут отправлены при появлении сети.'}</div><div class="card order-head"><h3>Состояние обмена</h3><div class="kv"><span>Последняя синхронизация</span><b>04.08.2026 · 11:28</b></div><div class="kv"><span>Открытые заказы</span><b>2 документа</b></div><div class="kv"><span>Перемещения РЦ</span><b>2 документа</b></div><div class="kv"><span>Очередь исходящих</span><b>${state.queue}</b></div></div>${state.queue?`<article class="card queue"><div class="queue-top"><div><h3>Поступление товаров</h3><p>operation_id: TSD-014-20260804-0018</p></div><span class="pill amber">Ожидает</span></div><div class="queue-actions"><button class="btn white small" data-action="retry-sync">Повторить</button></div></article><article class="card queue"><div class="queue-top"><div><h3>Подтверждение перемещения РЦ</h3><p>operation_id: TSD-014-20260804-0019</p></div><span class="pill blue">Отправка</span></div></article>`:empty('Очередь пуста','Все операции переданы в 1С.')}`}

function profileView(){return `${section('Профиль','Текущая рабочая сессия')}<div class="card profile"><div class="person"><div class="avatar">НИ</div><div><b>Нурбек Ибраимов</b><span>Операционист · МОЛ</span></div></div><button class="setting"><span>Торговая точка</span><b>Глобус 1</b></button><button class="setting"><span>Устройство</span><b>TSD-014-03</b></button><button class="setting"><span>Язык</span><b>RU</b></button><button class="setting" data-action="logout"><span>Завершить смену</span><b style="color:var(--red)">Выйти</b></button></div>`}

function empty(title,text){return `<div class="card empty"><i>□</i><h3>${title}</h3><p>${text}</p></div>`}

function modalView(){if(!state.modal)return '';
 if(state.modal==='line-edit')return lineEditModal();
 if(state.modal==='simple-qty')return simpleQtyModal();
 if(state.modal==='success')return successModal();
 return '';
}
function lineEditModal(){const p=product(state.currentEdit.product);const existing=state.orderReceipt.lines[p.id]||{};return `<div class="modal-wrap"><div class="modal"><div class="handle"></div><h2>${p.name}</h2><div class="sub">Цена ${money(p.price)} · ${p.code}</div><div class="field"><label>Количество / вес факт</label><input class="qty-input" id="editQty" inputmode="decimal" value="${existing.qty??''}" placeholder="0"></div><div class="field"><label>Годен до</label><input id="editExpiry" type="date" value="${existing.expiry||'2026-08-15'}"></div><div class="field"><label>Код ТН ВЭД</label><input id="editTnved" value="${existing.tnved||p.tnved||''}"></div><div class="field"><label>Номер ГТД</label><input id="editGtd" value="${existing.gtd||p.gtd||''}"></div><div class="modal-actions"><button class="btn white" data-action="close-modal">Отмена</button><button class="btn red" data-action="save-order-line">Сохранить</button></div></div></div>`}
function simpleQtyModal(){const ce=state.currentEdit;const p=product(ce.product);const value=ce.type==='rc'?(state.rcFact[p.id]??''):(state.assetLines[ce.index]?.qty??'');return `<div class="modal-wrap"><div class="modal"><div class="handle"></div><h2>${p.name}</h2><div class="sub">Введите фактическое количество / вес</div><input class="qty-input" id="simpleQty" inputmode="decimal" value="${value}"><div class="numpad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button class="key ${k==='⌫'?'red':''}" data-action="key" data-key="${k}">${k}</button>`).join('')}</div><div class="modal-actions"><button class="btn white" data-action="close-modal">Отмена</button><button class="btn red" data-action="save-simple-qty">Сохранить</button></div></div></div>`}
function successModal(){return `<div class="modal-wrap"><div class="modal"><div class="handle"></div><div class="empty"><i style="color:var(--green)">✓</i><h3>${state.currentEdit.title}</h3><p>${state.currentEdit.text}</p></div><button class="btn red wide" data-action="success-done">Готово</button></div></div>`}

function render(){const root=$('#app');if(!state.logged){root.innerHTML=loginView();bind();return}const views={home:homeView,'supplier-orders':supplierOrdersView,'supplier-receipt':supplierReceiptView,'supplier-review':supplierReviewView,'rc-docs':rcDocsView,'rc-receipt':rcReceiptView,'rc-review':rcReviewView,assets:assetsView,'asset-operation':assetOperationView,catalog:catalogView,sync:syncView,profile:profileView};root.innerHTML=shell((views[state.screen]||homeView)());bind()}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',handle));['supplierSearch','rcSearch','catalogSearch','invoiceNo','invoiceDate'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('input',inputHandle)})}
function inputHandle(e){if(e.target.id==='supplierSearch'){state.supplierSearch=e.target.value;render()}if(e.target.id==='rcSearch'){state.rcSearch=e.target.value;render()}if(e.target.id==='catalogSearch'){state.catalogSearch=e.target.value;render()}if(e.target.id==='invoiceNo')state.orderReceipt.invoiceNo=e.target.value;if(e.target.id==='invoiceDate')state.orderReceipt.invoiceDate=e.target.value}
function go(screen){state.screen=screen;state.modal=null;render();requestAnimationFrame(()=>{const sc=$('#scroll');if(sc)sc.scrollTop=0})}
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},1800)}
function handle(e){const a=e.currentTarget.dataset.action;const d=e.currentTarget.dataset;
 if(a==='login'){state.logged=true;go('home');return}
 if(a==='logout'){state.logged=false;state.screen='home';render();return}
 if(a==='nav'){go(d.screen);return}
 if(a==='toggle-online'){state.online=!state.online;render();return}
 if(a==='open-order'){state.activeOrder=d.id;state.orderReceipt={invoiceNo:'ВН-8421',invoiceDate:'2026-08-04',lines:{}};go('supplier-receipt');return}
 if(a==='fake-scan-order'){toast('Найден заказ Г010013811');return}
 if(a==='scan-mode'){state.scanMode=d.mode;render();return}
 if(a==='simulate-order-scan'){const o=orders.find(x=>x.id===state.activeOrder);const target=o.lines.find(l=>!(state.orderReceipt.lines[l.product]?.qty));const p=product((target||o.lines[0]).product);state.currentEdit={type:'order',product:p.id};state.modal='line-edit';render();return}
 if(a==='edit-order-line'){state.currentEdit={type:'order',product:d.product};state.modal='line-edit';render();return}
 if(a==='close-modal'){state.modal=null;render();return}
 if(a==='save-order-line'){const p=product(state.currentEdit.product);state.orderReceipt.lines[p.id]={qty:Number(($('#editQty').value||'0').replace(',','.')),expiry:$('#editExpiry').value,tnved:$('#editTnved').value.trim(),gtd:$('#editGtd').value.trim()};state.modal=null;render();return}
 if(a==='supplier-review'){go('supplier-review');return}
 if(a==='create-receipt'){state.queue++;state.currentEdit={title:'Поступление создано',text:'1С вернула документ Г010021955. Статус: проведён.'};state.modal='success';render();return}
 if(a==='success-done'){state.modal=null;go('home');return}
 if(a==='open-transfer'){state.activeTransfer=d.id;state.rcFact={};go('rc-receipt');return}
 if(a==='fake-scan-rc'){toast('Найдено перемещение Г010003188');return}
 if(a==='simulate-rc-scan'){const t=transfers.find(x=>x.id===state.activeTransfer);const p=product(t.lines[0].product);state.currentEdit={type:'rc',product:p.id};state.modal='simple-qty';render();return}
 if(a==='edit-rc-line'){state.currentEdit={type:'rc',product:d.product};state.modal='simple-qty';render();return}
 if(a==='key'){const inp=$('#simpleQty');if(d.key==='⌫')inp.value=inp.value.slice(0,-1);else inp.value+=d.key;return}
 if(a==='save-simple-qty'){const val=Number(($('#simpleQty').value||'0').replace(',','.'));if(state.currentEdit.type==='rc')state.rcFact[state.currentEdit.product]=val;else if(state.currentEdit.type==='asset')state.assetLines[state.currentEdit.index].qty=val;state.modal=null;render();return}
 if(a==='rc-review'){go('rc-review');return}
 if(a==='close-transfer'){state.queue++;state.currentEdit={title:'Приёмка закрыта',text:'Исходное перемещение подтверждено. Документ недопоставки создан автоматически по дельте.'};state.modal='success';render();return}
 if(a==='asset-tab'){state.assetTab=d.tab;state.assetLines=[];render();return}
 if(a==='asset-op'){state.assetOperation=d.op;state.assetLines=[];go('asset-operation');return}
 if(a==='simulate-asset-scan'){const list=assetCatalog();const p=list[state.assetLines.length%list.length];const exists=state.assetLines.find(x=>x.product===p.id);if(exists)exists.qty+=1;else state.assetLines.push({product:p.id,qty:1});render();return}
 if(a==='edit-asset-line'){const idx=Number(d.index);state.currentEdit={type:'asset',product:state.assetLines[idx].product,index:idx};state.modal='simple-qty';render();return}
 if(a==='save-asset'){state.queue++;state.currentEdit={title:state.assetOperation==='receipt'?'Черновик поступления создан':'Перемещение создано',text:state.assetOperation==='receipt'?'Документ передан в 1С для финальной проверки бухгалтером.':'Документ «Перемещение ТМЗ и МБП» создан в 1С.'};state.modal='success';render();return}
 if(a==='catalog-scan'){toast('Товар найден по штрихкоду');return}
 if(a==='retry-sync'){state.queue=Math.max(0,state.queue-1);toast('Операция отправлена повторно');return}
}
render();
</script>
</body>
</html>
