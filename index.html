function openReceipt(doc){state.activeReceipt=doc;state.receiptItems=doc.flow==='rc'?receiptSeed.map(x=>({...x})):[];state.lastScanned=null;state.sbConfirmed=false;state.screen='receipt'}
function addItem(id,toAssets=false){
 const target=toAssets?state.assetItems:state.receiptItems;const p=catalog.find(x=>x.id===id);if(!p)return;
 if(!toAssets&&state.activeReceipt?.flow==='rc'&&!target.some(x=>x.id===id)){state.modal={type:'rc-mismatch',id};render();return}
 let r=target.find(x=>x.id===id);if(r){r.fact=+(r.fact+(p.unit==='кг'?.1:1)).toFixed(2)}else target.push({id,plan:0,fact:1});state.lastScanned=target.find(x=>x.id===id);if(state.scanMode==='single'||p.unit==='кг')openQty(id,toAssets);else render()
}
function openQty(id,isAsset=false){const arr=isAsset?state.assetItems:state.screen==='assetop'?state.assetItems:state.receiptItems;const r=arr.find(x=>x.id===id);state.modal={type:'qty',id,isAsset};state.qtyValue=String(r?.fact??1);render()}
function saveQty(){const arr=state.modal.isAsset?state.assetItems:(state.screen==='assetop'?state.assetItems:state.receiptItems);let r=arr.find(x=>x.id===state.modal.id);if(!r){r={id:state.modal.id,plan:0,fact:1,extra:true};arr.push(r)}r.fact=parseFloat(state.qtyValue)||0;state.lastScanned=r;state.modal=null;toast('Количество сохранено')}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render()},1800)}
function fmt(n){return Number.isInteger(+n)?String(+n):(+n).toFixed(1).replace('.',',')}
function signed(n){return n>0?'+'+fmt(n):fmt(n)}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='login'){state.logged=true;state.screen='home';toast('Вход выполнен. Справочники готовы')}
 else if(a==='logout'){state.logged=false;state.screen='home';render()}
 else if(a==='nav'){state.screen=b.dataset.screen;render()}
 else if(a==='task'){+b.dataset.index===0?openReceipt(docs[0]):(state.activeAssetOp='inventory',state.assetItems=inventorySeed.map(x=>({...x})),state.sbConfirmed=false,state.screen='assetop');render()}
 else if(a==='open-doc'){openReceipt(docs.find(x=>x.id===b.dataset.id));render()}
 else if(a==='supplier-receipt'){state.modal={type:'supplier-start'};render()}
 else if(a==='start-supplier'){const supplier=$('#supplierName')?.value||'Прямой поставщик';const invoice=$('#invoiceNumber')?.value||'без номера';state.modal=null;openReceipt({id:'sup',flow:'supplier',code:invoice,supplier,invoice});render()}
 else if(a==='scan-mode'){state.scanMode=b.dataset.mode;render()}
 else if(a==='simulate-scan'){const ids=state.activeReceipt?.flow==='rc'?receiptSeed.map(x=>x.id):['p1','p2','p3','p4','p6'];addItem(ids[Math.floor(Math.random()*ids.length)])}
 else if(a==='qty'){openQty(b.dataset.id,state.screen==='assetop')}
 else if(a==='remove-item'){const arr=state.screen==='assetop'?state.assetItems:state.receiptItems;const i=arr.findIndex(x=>x.id===b.dataset.id);if(i>=0)arr.splice(i,1);render()}
 else if(a==='key'){const k=b.dataset.key;if(k==='⌫')state.qtyValue=state.qtyValue.slice(0,-1)||'0';else if(k==='.'&&!state.qtyValue.includes('.'))state.qtyValue+='.';else if(k!=='.')state.qtyValue=state.qtyValue==='0'?k:state.qtyValue+k;render()}
 else if(a==='save-qty')saveQty()
 else if(a==='close-modal'){state.modal=null;render()}
 else if(a==='manual-barcode'){state.modal={type:'manual'};render()}
 else if(a==='find-code'){const code=$('#manualCode')?.value||'';const p=catalog.find(x=>x.barcode===code||x.code===code);if(p){state.modal=null;if(state.screen==='assetop')addItem(p.kind==='asset'?p.id:'a1',true);else if(state.screen==='catalog'){state.modal={type:'card',id:p.id};render()}else addItem(p.kind==='product'?p.id:'p1')}else toast('Позиция не найдена в справочнике')}
 else if(a==='weight-picker'){state.modal={type:'picker',kind:'weight'};render()}
 else if(a==='open-asset-picker'){state.modal={type:'picker',kind:'asset'};render()}
 else if(a==='pick-item'){const isAsset=catalog.find(x=>x.id===b.dataset.id).kind==='asset';state.modal=null;addItem(b.dataset.id,isAsset)}
 else if(a==='open-reconcile'){state.screen='reconcile';render()}
 else if(a==='sb-scan'){state.modal={type:'sb'};render()}
 else if(a==='confirm-sb'){state.sbConfirmed=true;state.modal=null;toast('Списание подтверждено сотрудником СБ')}
 else if(a==='close-receipt'){const sup=state.activeReceipt&&state.activeReceipt.flow!=='rc';const hasShort=!sup&&receiptRows().some(r=>(r.fact-(r.plan||0))<0);state.queue++;state.screen='home';toast(sup?'Факт поставлен в очередь · Формирование поступлений v2':hasShort?'Основное перемещение + недопоставка поставлены в очередь 1С':'Основное перемещение поставлено в очередь 1С')}
 else if(a==='doc-filter'){state.docFilter=b.dataset.filter;render()}
 else if(a==='doc-search-clear'){state.docSearch='';render()}
 else if(a==='catalog-filter'){state.catalogFilter=b.dataset.filter;render()}
 else if(a==='asset-op'){state.activeAssetOp=b.dataset.op;state.assetItems=[];state.sbConfirmed=false;state.screen='assetop';render()}
 else if(a==='inventory-info'){toast('Инвентаризация открывается только из активной задачи на главном экране')}
 else if(a==='simulate-asset-scan'){const ids=['a1','a2','a3'];addItem(ids[Math.floor(Math.random()*ids.length)],true)}
 else if(a==='save-asset-op'){if(!state.assetItems.length){toast('Сначала добавьте хотя бы одну позицию');return}if(state.activeAssetOp==='writeoff'&&!state.sbConfirmed){toast('Требуется обязательное подтверждение СБ');return}state.queue++;state.screen='assets';toast(state.activeAssetOp==='writeoff'?'Акт подтверждён СБ и отправлен директору; финал — бухгалтер':state.activeAssetOp==='accept'?'Физический факт зафиксирован; документ оформит бухгалтер':state.activeAssetOp==='inventory'?'Ведомость расхождений отправлена в 1С':'Операция поставлена в очередь 1С')}
 else if(a==='open-sync'){state.screen='queue';render()}
 else if(a==='retry-event'){const ev=syncEvents[+b.dataset.index];if(ev){ev.status='ACK';ev.detail='Повторная доставка успешна';ev.tries++;state.queue=Math.max(0,state.queue-1);toast('Событие доставлено в 1С без дубля')}}
 else if(a==='sync-delta'){state.online=true;state.seq+=7;state.queue=0;state.lastSync='03.08.2026 · 10:47';toast('Дельта применена. Очередь доставлена в 1С')}
 else if(a==='full-sync'){state.online=true;state.seq+=100;state.lastSync='03.08.2026 · 10:48';toast('Полная синхронизация завершена')}
 else if(a==='catalog-open'){state.modal={type:'card',id:b.dataset.id};render()}
 else if(a==='catalog-scan'){state.modal={type:'card',id:'p1'};render()}
 else if(a==='lang'){state.lang=b.dataset.lang;toast(state.lang==='KG'?'Кыргызча терминология режими тандалды':'Русская терминология выбрана')}
});
render();
</script>
</body>
</html>
