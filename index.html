 if(state.modal.type==='qty'){const p=catalog.find(x=>x.id===state.modal.id);return `<div class="modal-wrap"><div class="modal"><div class="modal-handle"></div><h2>Количество</h2><div class="subtitle">${p.name} · нажмите цифры или используйте клавиатуру ТСД</div><input class="qty-display" value="${state.qtyValue}" readonly><div class="unit-row"><button class="${p.unit==='шт'?'active':''}">${p.unit}</button><button>${p.unit==='кг'?'Вес вводится в кг':'Упаковка / квант'}</button></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button class="key ${k==='⌫'?'red':''}" data-action="key" data-key="${k}">${k}</button>`).join('')}</div><div class="modal-actions"><button class="ghost" data-action="close-modal">Отмена</button><button class="primary" data-action="save-qty">Сохранить</button></div></div></div>`}
 if(state.modal.type==='manual')return `<div class="modal-wrap"><div class="modal"><div class="modal-handle"></div><h2>Ручной ввод ШК</h2><div class="subtitle">Fallback при нечитаемом или отсутствующем штрихкоде</div><div class="field"><label>Штрихкод / инвентарный номер</label><input id="manualCode" value="4870207014528" inputmode="numeric"></div><div class="modal-actions"><button class="ghost" data-action="close-modal">Отмена</button><button class="primary" data-action="find-code">Найти</button></div></div></div>`;
 if(state.modal.type==='picker'){const list=catalog.filter(x=>state.modal.kind==='asset'?x.kind==='asset':x.kind==='product'&&x.unit==='кг');return `<div class="modal-wrap"><div class="modal"><div class="modal-handle"></div><h2>${state.modal.kind==='asset'?'Справочник ТМЗ / МБП':'Весовой товар'}</h2><div class="subtitle">Данные доступны из локальной синхронизированной базы</div><div class="picker-list">${list.map(x=>`<button class="picker-row" data-action="pick-item" data-id="${x.id}"><b>${x.name}</b><span>${x.code} · ${x.barcode}</span></button>`).join('')}</div><button class="ghost wide" data-action="close-modal" style="margin-top:10px">Закрыть</button></div></div>`}
 if(state.modal.type==='sb')return `<div class="modal-wrap"><div class="modal"><div class="modal-handle"></div><h2>Подтверждение СБ</h2><div class="subtitle">QR-бейдж используется только для подтверждения операции, не для входа.</div><div class="scan-zone" style="background:#111;color:#fff"><div class="scan-glyph">▣</div><strong>Сканируйте QR-бейдж</strong><span>Демо автоматически распознает сотрудника СБ.</span><button data-action="confirm-sb">Сканировать бейдж</button></div><button class="ghost wide" data-action="close-modal" style="margin-top:10px">Отмена</button></div></div>`;
 if(state.modal.type==='card'){const p=catalog.find(x=>x.id===state.modal.id);return `<div class="modal-wrap"><div class="modal"><div class="modal-handle"></div><h2>${p.name}</h2><div class="subtitle">Карточка из локального справочника · seq ${state.seq}</div><div class="card sync-card" style="box-shadow:none"><div class="sync-line"><span>Код 1С</span><b>${p.code}</b></div><div class="sync-line"><span>Штрихкод</span><b>${p.barcode}</b></div>${p.kind==='product'?`<div class="sync-line"><span>Цена / остаток</span><b>${p.price} сом · ${p.stock} ${p.unit}</b></div><div class="sync-line"><span>Поставщик / канал</span><b>${p.supplier}<br>${p.channel}</b></div><div class="sync-line"><span>Партия / срок</span><b>${p.batch}</b></div>`:`<div class="sync-line"><span>Категория / статус</span><b>${p.category}<br>${p.status}</b></div><div class="sync-line"><span>Текущий МОЛ</span><b>${p.owner}</b></div>`}</div><button class="ghost wide" data-action="close-modal">Закрыть</button></div></div>`;}
 return ''
}
function bindInputs(){const inp=$('#catalogSearch');if(inp){inp.addEventListener('input',e=>{state.search=e.target.value;render()});inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}
function openReceipt(doc){state.activeReceipt=doc;state.receiptItems=receiptSeed.map(x=>({...x}));state.lastScanned=null;state.sbConfirmed=false;state.screen='receipt'}
function addItem(id,toAssets=false){const target=toAssets?state.assetItems:state.receiptItems;const p=catalog.find(x=>x.id===id);let r=target.find(x=>x.id===id);if(r){r.fact=+(r.fact+(p.unit==='кг'?.1:1)).toFixed(2)}else target.push({id,plan:0,fact:p.unit==='кг'?1:1,extra:!toAssets});state.lastScanned=target.find(x=>x.id===id);if(state.scanMode==='single'||p.unit==='кг')openQty(id,toAssets);else render()}
function openQty(id,isAsset=false){const arr=isAsset?state.assetItems:state.screen==='assetop'?state.assetItems:state.receiptItems;const r=arr.find(x=>x.id===id);state.modal={type:'qty',id,isAsset};state.qtyValue=String(r?.fact??1);render()}
function saveQty(){const arr=state.modal.isAsset?state.assetItems:(state.screen==='assetop'?state.assetItems:state.receiptItems);let r=arr.find(x=>x.id===state.modal.id);if(!r){r={id:state.modal.id,plan:0,fact:1,extra:true};arr.push(r)}r.fact=parseFloat(state.qtyValue)||0;state.lastScanned=r;state.modal=null;toast('Количество сохранено')}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast=null;render()},1800)}
function fmt(n){return Number.isInteger(+n)?String(+n):(+n).toFixed(1).replace('.',',')}
function signed(n){return n>0?'+'+fmt(n):fmt(n)}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='login'){state.logged=true;state.screen='home';toast('Вход выполнен. Справочники готовы')}
 else if(a==='logout'){state.logged=false;state.screen='home';render()}
 else if(a==='nav'){state.screen=b.dataset.screen;render()}
 else if(a==='task'){+b.dataset.index===0?openReceipt(docs[0]):(state.activeAssetOp='inventory',state.assetItems=[],state.screen='assetop');render()}
 else if(a==='open-doc'){openReceipt(docs.find(x=>x.id===b.dataset.id));render()}
 else if(a==='free-receipt'){openReceipt({id:'free',free:true,code:'Без документа',supplier:'Свободная приёмка'});state.receiptItems=[];render()}
 else if(a==='scan-mode'){state.scanMode=b.dataset.mode;render()}
 else if(a==='simulate-scan'){const ids=['p1','p2','p3','p4','p6'];addItem(ids[Math.floor(Math.random()*ids.length)])}
 else if(a==='qty'){openQty(b.dataset.id,state.screen==='assetop')}
 else if(a==='remove-item'){const arr=state.screen==='assetop'?state.assetItems:state.receiptItems;const i=arr.findIndex(x=>x.id===b.dataset.id);if(i>=0)arr.splice(i,1);render()}
 else if(a==='key'){const k=b.dataset.key;if(k==='⌫')state.qtyValue=state.qtyValue.slice(0,-1)||'0';else if(k==='.'&&!state.qtyValue.includes('.'))state.qtyValue+='.';else if(k!=='.')state.qtyValue=state.qtyValue==='0'?k:state.qtyValue+k;render()}
 else if(a==='save-qty')saveQty()
 else if(a==='close-modal'){state.modal=null;render()}
 else if(a==='manual-barcode'){state.modal={type:'manual'};render()}
 else if(a==='find-code'){const code=$('#manualCode')?.value||'';const p=catalog.find(x=>x.barcode===code||x.code===code);if(p){state.modal=null;if(state.screen==='assetop')addItem(p.kind==='asset'?p.id:'a1',true);else if(state.screen==='catalog'){state.modal={type:'card',id:p.id};render()}else addItem(p.kind==='product'?p.id:'p1')}else toast('Позиция не найдена в справочнике')}
 else if(a==='weight-picker'){state.modal={type:'picker',kind:'weight'};render()}
 else if(a==='open-asset-picker'){state.modal={type:'picker',kind:'asset'};render()}
 else if(a==='pick-item'){const isAsset=catalog.find(x=>x.id===b.dataset.id).kind==='asset';state.modal=null;addItem(b.dataset.id,isAsset)}
 else if(a==='open-reconcile'){state.screen='reconcile';render()}
 else if(a==='sb-scan'){state.modal={type:'sb'};render()}
 else if(a==='confirm-sb'){state.sbConfirmed=true;state.modal=null;toast('Приёмка подтверждена сотрудником СБ')}
 else if(a==='close-receipt'){if(!state.sbConfirmed)return;state.queue++;state.screen='home';toast('Документы сформированы и поставлены в очередь 1С')}
 else if(a==='doc-filter'){state.docFilter=b.dataset.filter;render()}
 else if(a==='asset-op'){state.activeAssetOp=b.dataset.op;state.assetItems=[];state.screen='assetop';render()}
 else if(a==='simulate-asset-scan'){const ids=['a1','a2','a3'];addItem(ids[Math.floor(Math.random()*ids.length)],true)}
 else if(a==='save-asset-op'){if(!state.assetItems.length){toast('Сначала добавьте хотя бы одну позицию');return}state.queue++;state.screen='assets';toast(state.activeAssetOp==='writeoff'?'Акт списания отправлен на согласование':'Операция поставлена в очередь 1С')}
 else if(a==='open-sync'){state.screen='queue';render()}
 else if(a==='sync-delta'){state.online=true;state.seq+=7;state.queue=0;state.lastSync='31.07.2026 · 10:47';toast('Дельта применена. Очередь доставлена в 1С')}
 else if(a==='full-sync'){state.online=true;state.seq+=100;state.lastSync='31.07.2026 · 10:48';toast('Полная синхронизация завершена')}
 else if(a==='catalog-open'){state.modal={type:'card',id:b.dataset.id};render()}
 else if(a==='catalog-scan'){state.modal={type:'card',id:'p1'};render()}
 else if(a==='lang'){state.lang=b.dataset.lang;toast(state.lang==='KG'?'Кыргыз тили тандалды':'Русский язык выбран')}
});
render();
</script>
</body>
</html>
